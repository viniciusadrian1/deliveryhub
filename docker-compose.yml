services:
  postgres:
    image: postgres:16-alpine
    container_name: deliveryhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: deliveryhub
      POSTGRES_PASSWORD: deliveryhub
      POSTGRES_DB: deliveryhub
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U deliveryhub -d deliveryhub']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: deliveryhub-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
